name: "Caramel-Stable"
run-name: "Caramel-Stable-SlopMax (${{ github.ref_name }})"

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Release flavour: both variants are published from main and next.
  release:
    name: "SlopMax / ${{ matrix.lto }}"
    strategy:
      fail-fast: false
      matrix:
        lto:
          - NoLTO
          - ThinLTO
    uses: ./.github/workflows/build-kernel_latest.yaml
    with:
      profile: SlopMax
      lto: ${{ matrix.lto }}
      runner: Hosted
    secrets: inherit
