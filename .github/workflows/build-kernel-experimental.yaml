name: "Caramel-Experimental"
run-name: "Caramel-Experimental-SlopMax-NoLTO (${{ github.ref_name }})"

on:
  push:
    branches:
      - experimental
      - experimental-7.4-rc3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Only NoLTO is built here. It is what gets booted and tested first.
  # ThinLTO is built later, when the change lands on next/main.
  nolto:
    name: "SlopMax / NoLTO"
    uses: ./.github/workflows/build-kernel_latest.yaml
    with:
      profile: SlopMax
      lto: NoLTO
      runner: Hosted
    secrets: inherit
